services:
  qwertylearner:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8990:5173'

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qwerty
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: qwerty
    ports:
      - '55432:5432'
    volumes:
      - qwerty-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qwerty -d qwerty']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  qwerty-db:
